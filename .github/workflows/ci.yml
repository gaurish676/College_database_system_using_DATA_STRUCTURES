name: C++17 Build and Unit Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Compiler Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ make

      - name: Build College ERP Engine
        run: |
          make clean
          make

      - name: Execute Automated Unit Test Suite
        run: |
          make test
